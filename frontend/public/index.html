<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0a0514" />
        <meta
            name="description"
            content="Lv99.ai turns a KSSM chapter into notes, a mind map, a summary, flashcards and a quiz — in Bahasa Melayu and English, ready in minutes."
        />

        <!-- Fonts are linked here rather than @import-ed from index.css: an @import cannot
             start downloading until the stylesheet that contains it has parsed, which
             serialises the font fetch behind the CSS and delays first text paint. These
             are the three families actually used; the old Inter link was loaded on every
             page and referenced nowhere. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        />

        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

        <!-- Link previews. Without these a shared Lv99.ai link renders as a bare URL in
             WhatsApp and Slack, which is how most of this audience passes links around. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Lv99.ai" />
        <meta property="og:title" content="Lv99.ai — The AI Tutor That Levels You Up" />
        <meta
            property="og:description"
            content="Turn a KSSM chapter into notes, a mind map, a summary, flashcards and a quiz — in Bahasa Melayu and English."
        />
        <meta property="og:image" content="%PUBLIC_URL%/icon-512.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Lv99.ai — The AI Tutor That Levels You Up" />
        <meta
            name="twitter:description"
            content="Turn a KSSM chapter into notes, a mind map, a summary, flashcards and a quiz — in Bahasa Melayu and English."
        />
        <meta name="twitter:image" content="%PUBLIC_URL%/icon-512.png" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Lv99.ai — The AI Tutor That Levels You Up</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
